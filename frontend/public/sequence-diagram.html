<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sequence Diagram MahjongYuks — Alur Proses Bisnis End-to-End</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #FAF8F5;
      color: #111E18;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header-bar {
      width: 100%;
      max-width: 1140px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: #183629;
      color: #FAF8F5;
      padding: 20px 28px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(24, 54, 41, 0.15);
      margin-bottom: 24px;
    }
    .title-wrap h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .title-wrap p {
      font-size: 13px;
      color: #C5D2CB;
      margin-top: 4px;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
    }
    .btn-png {
      background-color: #86EFAC;
      color: #111E18;
    }
    .btn-png:hover {
      background-color: #4ADE80;
    }
    .btn-svg {
      background-color: rgba(255, 255, 255, 0.12);
      color: #FAF8F5;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-svg:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    .diagram-card {
      width: 100%;
      max-width: 1140px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }
    .diagram-card img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="title-wrap">
      <h1>Sequence Diagram — Alur Proses Bisnis MahjongYuks</h1>
      <p>Autentikasi, Reservasi Meja, Simulasi Pembayaran, Check-in, Sesi Bermain, dan Leaderboard</p>
    </div>
    <div class="actions">
      <a href="/sequence-diagram.png" download="sequence-diagram-mahjongyuks.png" class="btn btn-png">
        Download PNG (300 KB)
      </a>
      <a href="/sequence-diagram.svg" download="sequence-diagram-mahjongyuks.svg" class="btn btn-svg">
        Download SVG (Vektor)
      </a>
    </div>
  </div>

  <div class="diagram-card">
    <img src="/sequence-diagram.svg" alt="Sequence Diagram MahjongYuks">
  </div>

</body>
</html>
